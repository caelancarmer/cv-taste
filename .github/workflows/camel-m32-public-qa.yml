name: Camel M32 public guidance QA
on:
  pull_request:
    paths:
      - '.camel/**'
      - '.agents/skills/trajectory-orchestrator/**'
      - '.agents/skills/execute-next-batch/**'
      - 'docs/agent-harness/camel-m32-public.md'
      - 'tests/test_camel_m32_public.py'
      - '.github/workflows/camel-m32-public-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify public-safe M32 contract
        run: python -m unittest discover -s tests -p 'test_camel_m32_public.py' -v
